name: Lint & Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux

      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The icon resource is built by mingw's windres, which preprocesses through
      # mingw's gcc. Nothing else in the Windows check links or needs mingw.
      - name: Install mingw for the icon resource
        run: sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Clippy (Windows)
        run: cargo clippy --target x86_64-pc-windows-gnu --all-targets -- -D warnings

      - name: Audit advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

      - name: Run tests
        run: cargo test
